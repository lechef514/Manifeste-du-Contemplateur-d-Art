<script>
  const paragraphs = document.querySelectorAll(".paragraph");
  let index = 0;
  let voiceEnabled = false;
  let silenceOnly = false;
  const synth = window.speechSynthesis;
  let selectedVoice = null;

  const startBtn = document.getElementById("startExperience");
  const silenceBtn = document.getElementById("silenceToggle");

  // Charger les voix correctement
  function loadVoices() {
    const voices = synth.getVoices();
    selectedVoice =
      voices.find(v => v.lang === "fr-FR" && v.name.toLowerCase().includes("female")) ||
      voices.find(v => v.lang === "fr-FR") ||
      voices[0];
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  startBtn.addEventListener("click", () => {
    voiceEnabled = true;
    silenceOnly = false;
    startBtn.style.display = "none";
    showNext();
  });

  silenceBtn.addEventListener("click", () => {
    silenceOnly = true;
    voiceEnabled = false;
    synth.cancel();
    silenceBtn.textContent = "✔ Silence activé";
  });

  function speak(text) {
    if (!voiceEnabled || silenceOnly || !selectedVoice) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = selectedVoice;
    utterance.lang = "fr-FR";
    utterance.rate = 0.55;   // très lent
    utterance.pitch = 1.05; // doux
    utterance.volume = 0.85;

    synth.cancel();
    synth.speak(utterance);
  }

  function showNext() {
    if (index < paragraphs.length) {
      const p = paragraphs[index];
      p.style.opacity = 1;

      setTimeout(() => {
        speak(p.innerText);
      }, 700); // respiration

      index++;
      setTimeout(showNext, 5500);
    }
  }
</script>
