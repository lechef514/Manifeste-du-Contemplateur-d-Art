<script>
/* ===============================
   CONFIGURATION GÉNÉRALE
================================ */

const paragraphs = document.querySelectorAll(".paragraph");
const synth = window.speechSynthesis;

let index = 0;
let hasStarted = false;      // mode exposition : une seule lecture
let silenceOnly = false;
let selectedVoice = null;

/* ===============================
   BOUTONS
================================ */

const startBtn = document.getElementById("startExperience");
const silenceBtn = document.getElementById("silenceToggle");

/* ===============================
   SÉLECTION VOIX FÉMININE
================================ */

function loadVoices() {
  const voices = synth.getVoices();

  // Priorité à une voix féminine française si disponible
  selectedVoice =
    voices.find(v =>
      v.lang === "fr-FR" &&
      (
        v.name.toLowerCase().includes("female") ||
        v.name.toLowerCase().includes("femme") ||
        v.name.toLowerCase().includes("julie") ||
        v.name.toLowerCase().includes("audrey")
      )
    )
    || voices.find(v => v.lang === "fr-FR")
    || voices[0];
}

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

/* ===============================
   CONTRÔLES UTILISATEUR
================================ */

startBtn.addEventListener("click", () => {
  if (hasStarted) return;          // une seule lecture (musée)
  hasStarted = true;
  silenceOnly = false;
  startBtn.style.display = "none";
  revealNextParagraph();
});

silenceBtn.addEventListener("click", () => {
  silenceOnly = true;
  synth.cancel();
  silenceBtn.textContent = "✔ Silence activé";
});

/* ===============================
   LECTURE VOCALE
================================ */

function speak(text) {
  if (silenceOnly || !selectedVoice) return;

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.voice = selectedVoice;
  utterance.lang = "fr-FR";

  // Paramètres pour voix douce, féminine, contemplative
  utterance.rate = 0.55;    // très lent
  utterance.pitch = 1.05;   // légèrement plus doux
  utterance.volume = 0.85;

  synth.cancel();
  synth.speak(utterance);
}

/* ===============================
   ANIMATION DU TEXTE
================================ */

function revealNextParagraph() {
  if (index >= paragraphs.length) return;

  const paragraph = paragraphs[index];
  paragraph.style.opacity = 1;

  // respiration avant la voix
  setTimeout(() => {
    speak(paragraph.innerText);
  }, 900);

  index++;

  // rythme lent et régulier
  setTimeout(revealNextParagraph, 5800);
}
</script>
